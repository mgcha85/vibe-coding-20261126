<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>말이 코드가 되는 시대 : 바이브 코딩(Vibe Coding)의 이상과 현실, 그리고 프로덕션 엔지니어링</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
            },
            dark: {
              950: '#030712',
              900: '#070d1a',
              850: '#0c1527',
              800: '#111f38',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #030712;
      color: #f3f4f6;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      font-family: 'Pretendard', sans-serif;
      user-select: none;
    }

    /* 16:9 Presentation Stage */
    .slide-viewport {
      position: relative;
      width: 100vw;
      height: 56.25vw; /* 16:9 */
      max-height: 100vh;
      max-width: 177.78vh; /* 16:9 */
      box-shadow: 0 25px 70px -15px rgba(0, 0, 0, 0.8), 0 0 50px rgba(14, 165, 233, 0.12);
      background: radial-gradient(circle at 10% 10%, #0d1a33 0%, #060b17 65%, #030712 100%);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 3.5rem 4.5rem;
      box-sizing: border-box;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      transform: scale(0.985);
      display: flex;
      flex-direction: column;
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: scale(1);
    }

    /* Bento Tile Style */
    .bento-tile {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 0.875rem;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .bento-tile:hover {
      border-color: rgba(56, 189, 248, 0.35);
      background: rgba(20, 32, 58, 0.75);
    }

    .badge-glow {
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.3);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
    ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 3px; }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }
    .ambient-glow {
      animation: pulseGlow 5s infinite ease-in-out;
    }
  </style>
</head>
<body>

  <!-- 16:9 Presentation Viewport -->
  <div class="slide-viewport relative flex flex-col justify-between" id="presentationContainer">

    <!-- Ambient Gradient Backdrops -->
    <div class="absolute -top-36 -right-36 w-96 h-96 bg-sky-500/10 rounded-full blur-3xl pointer-events-none ambient-glow"></div>
    <div class="absolute -bottom-36 -left-36 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none ambient-glow"></div>

    <!-- Global Header -->
    <header class="absolute top-0 left-0 right-0 h-14 px-10 flex items-center justify-between text-xs font-mono text-slate-400 z-20 border-b border-slate-800/60 bg-dark-900/50 backdrop-blur-md">
      <div class="flex items-center gap-3">
        <span id="chapterBadge" class="px-2.5 py-0.5 rounded-full bg-slate-500/15 text-slate-300 font-bold border border-slate-400/30 transition-all duration-200">INTRO · 오프닝</span>
        <span class="text-slate-600">|</span>
        <span class="text-slate-300 font-medium">말이 코드가 되는 시대 : 바이브 코딩(Vibe Coding)</span>
      </div>
      <div class="flex items-center gap-4">
        <button id="tocBtn" class="hover:text-sky-400 flex items-center gap-1.5 transition-colors px-2.5 py-1 rounded bg-slate-800/60 border border-slate-700/60 text-slate-300">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path></svg>
          <span>목차 [M]</span>
        </button>
        <button id="fullscreenBtn" class="hover:text-sky-400 flex items-center gap-1.5 transition-colors px-2.5 py-1 rounded bg-slate-800/60 border border-slate-700/60 text-slate-300">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1v4m0-4h-4m4 4l-5-5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
          <span>전체화면 [F]</span>
        </button>
        <span id="slideCounter" class="text-sky-400 font-bold font-mono">01 / {{TOTAL_SLIDES}}</span>
      </div>
    </header>

    <!-- Slides Wrapper (Injected from slides/ component files) -->
    <main class="relative w-full h-full pt-14 pb-12 flex-1 overflow-hidden" id="slidesWrapper">
{{SLIDES_CONTENT}}
    </main>

    <!-- Global Footer Controls -->
    <footer class="absolute bottom-0 left-0 right-0 h-12 px-8 flex items-center justify-between text-xs text-slate-400 z-20 border-t border-slate-800/60 bg-dark-900/60 backdrop-blur-sm">
      <div class="flex items-center gap-2">
        <span class="text-[11px] text-slate-500 font-mono">단축키: ← 이전 | → / Space 다음 | F 전체화면 | M 목차</span>
      </div>

      <!-- Navigation buttons -->
      <div class="flex items-center gap-3">
        <button id="prevBtn" class="px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 transition-colors flex items-center gap-1 border border-slate-700">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
          <span>이전</span>
        </button>
        <button id="nextBtn" class="px-4 py-1 rounded bg-sky-600 hover:bg-sky-500 text-white font-semibold transition-colors flex items-center gap-1 shadow-lg shadow-sky-600/30">
          <span>다음</span>
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </button>
      </div>

      <!-- Progress bar -->
      <div class="w-32 bg-slate-800 h-1.5 rounded-full overflow-hidden border border-slate-700/50">
        <div id="progressBar" class="bg-gradient-to-r from-sky-400 to-indigo-500 h-full w-0 transition-all duration-300"></div>
      </div>
    </footer>

    <!-- Table of Contents Modal -->
    <div id="tocModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
      <div class="bento-tile max-w-3xl w-full p-6 max-h-[85vh] flex flex-col border border-sky-500/30 shadow-2xl">
        <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
          <div class="flex items-center gap-3">
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
              <span class="text-sky-400 font-mono">📑</span> 전체 목차 (Curriculum Index)
            </h3>
            <span class="text-xs text-slate-400 font-mono">총 {{TOTAL_SLIDES}}개 슬라이드</span>
          </div>
          <div class="flex items-center gap-3">
            <button id="toggleAllTocBtn" class="text-xs px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 flex items-center gap-1.5 transition-colors">
              <svg id="toggleAllIcon" class="w-3.5 h-3.5 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
              <span id="toggleAllText">모두 접기</span>
            </button>
            <button id="closeTocBtn" class="text-slate-400 hover:text-white p-1">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
          </div>
        </div>
        <div id="tocList" class="overflow-y-auto space-y-3 pr-2 flex-1 text-sm">
          <!-- Dynamically populated with Depth 1 (Chapters) & Depth 2 (Slides) -->
        </div>
      </div>
    </div>

  </div>

  <script>
    const slides = document.querySelectorAll('.slide');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const slideCounter = document.getElementById('slideCounter');
    const progressBar = document.getElementById('progressBar');
    const tocBtn = document.getElementById('tocBtn');
    const tocModal = document.getElementById('tocModal');
    const closeTocBtn = document.getElementById('closeTocBtn');
    const tocList = document.getElementById('tocList');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const chapterBadge = document.getElementById('chapterBadge');
    const toggleAllTocBtn = document.getElementById('toggleAllTocBtn');
    const toggleAllIcon = document.getElementById('toggleAllIcon');
    const toggleAllText = document.getElementById('toggleAllText');

    let currentSlide = 0;
    const totalSlides = slides.length;

    function updateSlide(index) {
      if (index < 0) index = 0;
      if (index >= totalSlides) index = totalSlides - 1;

      slides.forEach((slide, idx) => {
        slide.classList.remove('active');
        if (idx === index) {
          slide.classList.add('active');
        }
      });

      currentSlide = index;

      const currentSlideEl = slides[currentSlide];
      if (currentSlideEl && chapterBadge) {
        const badgeText = currentSlideEl.getAttribute('data-chapter-badge') || 'VIBE CODING';
        const badgeColor = currentSlideEl.getAttribute('data-chapter-color') || 'bg-sky-500/15 text-sky-300 border-sky-400/30';
        chapterBadge.textContent = badgeText;
        chapterBadge.className = `px-2.5 py-0.5 rounded-full font-bold border transition-all duration-200 ${badgeColor}`;
      }

      const currentStr = String(currentSlide + 1).padStart(2, '0');
      const totalStr = String(totalSlides).padStart(2, '0');
      slideCounter.textContent = `${currentStr} / ${totalStr}`;

      const progress = ((currentSlide + 1) / totalSlides) * 100;
      progressBar.style.width = `${progress}%`;

      prevBtn.disabled = currentSlide === 0;
      prevBtn.style.opacity = currentSlide === 0 ? '0.4' : '1';
      nextBtn.disabled = currentSlide === totalSlides - 1;
      nextBtn.style.opacity = currentSlide === totalSlides - 1 ? '0.4' : '1';

      // Update active highlight in TOC if rendered
      document.querySelectorAll('.toc-slide-item').forEach((item) => {
        const itemIdx = parseInt(item.getAttribute('data-slide-index'), 10);
        if (itemIdx === currentSlide) {
          item.classList.add('bg-sky-500/20', 'text-sky-200', 'border-sky-500/40', 'font-semibold');
          item.classList.remove('text-slate-300', 'border-transparent');
        } else {
          item.classList.remove('bg-sky-500/20', 'text-sky-200', 'border-sky-500/40', 'font-semibold');
          item.classList.add('text-slate-300', 'border-transparent');
        }
      });
    }

    function prevSlide() { if (currentSlide > 0) updateSlide(currentSlide - 1); }
    function nextSlide() { if (currentSlide < totalSlides - 1) updateSlide(currentSlide + 1); }

    window.addEventListener('keydown', (e) => {
      if (!tocModal.classList.contains('hidden')) {
        if (e.key === 'Escape' || e.key === 'm' || e.key === 'M') toggleToc(false);
        return;
      }

      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') nextSlide();
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
      else if (e.key === 'Home') updateSlide(0);
      else if (e.key === 'End') updateSlide(totalSlides - 1);
      else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
      else if (e.key === 'm' || e.key === 'M') toggleToc(true);
    });

    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }
    fullscreenBtn.addEventListener('click', toggleFullscreen);

    // Build 2-Depth Table of Contents (Depth 1: Chapters, Depth 2: Slides)
    const chapters = [];
    let currentChapterGroup = null;

    slides.forEach((slide, idx) => {
      const chapterId = slide.getAttribute('data-chapter-id') || 'misc';
      const chapterBadge = slide.getAttribute('data-chapter-badge') || 'CHAPTER';
      const chapterTitle = slide.getAttribute('data-chapter-title') || chapterBadge;
      const chapterColor = slide.getAttribute('data-chapter-color') || 'bg-sky-500/15 text-sky-300 border-sky-400/30';
      const chapterAccent = slide.getAttribute('data-chapter-accent') || 'text-sky-400';
      const slideTitle = slide.getAttribute('data-title') || `Slide ${idx + 1}`;

      if (!currentChapterGroup || currentChapterGroup.id !== chapterId) {
        currentChapterGroup = {
          id: chapterId,
          badge: chapterBadge,
          title: chapterTitle,
          color: chapterColor,
          accent: chapterAccent,
          slides: []
        };
        chapters.push(currentChapterGroup);
      }

      currentChapterGroup.slides.push({
        index: idx,
        title: slideTitle,
      });
    });

    let allExpanded = true;
    const chapterBodies = [];
    const chevronIcons = [];

    chapters.forEach((ch) => {
      const chapterCard = document.createElement('div');
      chapterCard.className = 'bento-tile p-3 bg-slate-900/70 border border-slate-800/80 rounded-xl overflow-hidden transition-all';

      // Depth 1 Header
      const header = document.createElement('div');
      header.className = 'flex items-center justify-between cursor-pointer select-none p-1.5 rounded-lg hover:bg-slate-800/60 transition-colors';

      const firstSlideNum = String(ch.slides[0].index + 1).padStart(2, '0');
      const lastSlideNum = String(ch.slides[ch.slides.length - 1].index + 1).padStart(2, '0');
      const rangeStr = ch.slides.length > 1 ? `#${firstSlideNum} ~ #${lastSlideNum}` : `#${firstSlideNum}`;

      header.innerHTML = `
        <div class="flex items-center gap-2.5">
          <svg class="w-4 h-4 text-slate-400 transition-transform duration-200 transform rotate-0 chevron-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
          <span class="px-2 py-0.5 rounded text-[11px] font-bold font-mono border ${ch.color}">${ch.badge}</span>
          <span class="font-bold text-white text-sm tracking-tight">${ch.title}</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-xs font-mono text-slate-400 bg-slate-800/80 px-2 py-0.5 rounded border border-slate-700/50">${ch.slides.length} slides</span>
          <span class="text-[11px] font-mono text-slate-500">${rangeStr}</span>
        </div>
      `;

      // Depth 2 Slides List (Default: Expanded)
      const body = document.createElement('div');
      body.className = 'chapter-body mt-2.5 pt-2 border-t border-slate-800/60 space-y-1 pl-4';

      const chevron = header.querySelector('.chevron-icon');
      chapterBodies.push(body);
      chevronIcons.push(chevron);

      // Toggle expand/collapse on header click
      header.addEventListener('click', () => {
        const isHidden = body.classList.contains('hidden');
        if (isHidden) {
          body.classList.remove('hidden');
          chevron.classList.remove('-rotate-90');
          chevron.classList.add('rotate-0');
        } else {
          body.classList.add('hidden');
          chevron.classList.remove('rotate-0');
          chevron.classList.add('-rotate-90');
        }
      });

      ch.slides.forEach((s) => {
        const item = document.createElement('div');
        item.className = 'toc-slide-item px-3 py-1.5 rounded-lg hover:bg-slate-800/80 cursor-pointer flex items-center justify-between text-slate-300 transition-colors border border-transparent hover:border-slate-700/60';
        item.setAttribute('data-slide-index', s.index);
        item.innerHTML = `
          <span class="flex items-center gap-2.5 truncate">
            <span class="font-mono text-xs ${ch.accent} font-bold">${String(s.index + 1).padStart(2, '0')}</span>
            <span class="text-xs truncate">${s.title}</span>
          </span>
          <span class="text-[10px] text-slate-500 font-mono ml-2 shrink-0">#${s.index + 1}</span>
        `;
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          updateSlide(s.index);
          toggleToc(false);
        });
        body.appendChild(item);
      });

      chapterCard.appendChild(header);
      chapterCard.appendChild(body);
      tocList.appendChild(chapterCard);
    });

    // Toggle All Expand / Collapse
    if (toggleAllTocBtn) {
      toggleAllTocBtn.addEventListener('click', () => {
        allExpanded = !allExpanded;
        chapterBodies.forEach(b => {
          if (allExpanded) {
            b.classList.remove('hidden');
          } else {
            b.classList.add('hidden');
          }
        });
        chevronIcons.forEach(icon => {
          if (allExpanded) {
            icon.classList.remove('-rotate-90');
            icon.classList.add('rotate-0');
          } else {
            icon.classList.remove('rotate-0');
            icon.classList.add('-rotate-90');
          }
        });
        toggleAllText.textContent = allExpanded ? '모두 접기' : '모두 펼치기';
        if (toggleAllIcon) {
          toggleAllIcon.classList.toggle('rotate-180', !allExpanded);
        }
      });
    }

    function toggleToc(show) {
      if (show) {
        tocModal.classList.remove('hidden');
        setTimeout(() => {
          tocModal.classList.remove('opacity-0');
          const activeItem = tocList.querySelector(`.toc-slide-item[data-slide-index="${currentSlide}"]`);
          if (activeItem) {
            const parentBody = activeItem.closest('.chapter-body');
            if (parentBody && parentBody.classList.contains('hidden')) {
              parentBody.classList.remove('hidden');
              const header = parentBody.previousElementSibling;
              const chevron = header ? header.querySelector('.chevron-icon') : null;
              if (chevron) {
                chevron.classList.remove('-rotate-90');
                chevron.classList.add('rotate-0');
              }
            }
            activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          }
        }, 10);
      } else {
        tocModal.classList.add('opacity-0');
        setTimeout(() => tocModal.classList.add('hidden'), 200);
      }
    }

    tocBtn.addEventListener('click', () => toggleToc(true));
    closeTocBtn.addEventListener('click', () => toggleToc(false));
    tocModal.addEventListener('click', (e) => {
      if (e.target === tocModal) toggleToc(false);
    });

    window.updateSlide = updateSlide;
    updateSlide(0);
  </script>
</body>
</html>
