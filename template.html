<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>말이 코드가 되는 시대 : 바이브 코딩(Vibe Coding)의 이상과 현실, 그리고 프로덕션 엔지니어링</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              400: '#3DB4CD',
              500: '#2D9BB2',
              600: '#1F7B8E',
            },
            academic: {
              teal: '#2D9BB2',
              purple: '#554596',
              charcoal: '#1A1A1A',
              slate: '#374151',
              muted: '#64748B',
              bg: '#F8F9FA',
              card: '#FFFFFF',
              border: '#E5E7EB',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #EDF0F2;
      color: #1A1A1A;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      font-family: 'Pretendard', sans-serif;
      user-select: none;
    }

    /* 16:9 Presentation Stage - Modern Editorial & Academic Insight */
    .slide-viewport {
      position: relative;
      width: 100vw;
      height: 56.25vw; /* 16:9 */
      max-height: 100vh;
      max-width: 177.78vh; /* 16:9 */
      box-shadow: 0 25px 70px -15px rgba(0, 0, 0, 0.08), 0 0 1px 1px rgba(0, 0, 0, 0.04);
      background: radial-gradient(circle at 10% 10%, #FFFFFF 0%, #F8F9FA 65%, #F1F3F5 100%);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #E2E8F0;
      color: #1A1A1A;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 3.5rem 4.5rem;
      box-sizing: border-box;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      transform: scale(0.985);
      display: flex;
      flex-direction: column;
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: scale(1);
    }

    /* Bento Tile Style - Whitepaper Clean Card */
    .bento-tile {
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 0.875rem;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.04), 0 1px 2px -1px rgba(0, 0, 0, 0.03);
    }
    .bento-tile:hover {
      background: #FFFFFF !important;
      border-color: #E5E7EB !important;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.04) !important;
      transform: none !important;
    }

    .badge-glow {
      box-shadow: 0 0 16px rgba(45, 155, 178, 0.15);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #F1F3F5; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.35; }
    }
    .ambient-glow {
      animation: pulseGlow 5s infinite ease-in-out;
    }

    /* ==========================================================================
       MODERN EDITORIAL & ACADEMIC INSIGHT SYSTEM OVERRIDES
       Calibrates all slides to clean whitepaper/journal tone
       ========================================================================== */
    .slide-viewport .text-white { color: #1A1A1A !important; }
    .slide-viewport .text-slate-100 { color: #1A1A1A !important; }
    .slide-viewport .text-slate-200 { color: #1E293B !important; }
    .slide-viewport .text-slate-300 { color: #334155 !important; }
    .slide-viewport .text-slate-400 { color: #475569 !important; }
    .slide-viewport .text-slate-500 { color: #475569 !important; }
    .slide-viewport .text-slate-600 { color: #334155 !important; }

    /* Point Duotone Accents: Academic Teal (#2D9BB2) & Purple (#554596) */
    .slide-viewport [class*="text-sky-200"],
    .slide-viewport [class*="text-sky-300"],
    .slide-viewport [class*="text-sky-400"],
    .slide-viewport [class*="text-cyan-200"],
    .slide-viewport [class*="text-cyan-300"],
    .slide-viewport [class*="text-cyan-400"] { color: #0E7490 !important; }

    .slide-viewport [class*="text-indigo-200"],
    .slide-viewport [class*="text-indigo-300"],
    .slide-viewport [class*="text-indigo-400"],
    .slide-viewport [class*="text-purple-200"],
    .slide-viewport [class*="text-purple-300"],
    .slide-viewport [class*="text-purple-400"] { color: #554596 !important; }

    /* Status Accents (Calibrated for whitepaper high contrast) */
    .slide-viewport [class*="text-emerald-200"],
    .slide-viewport [class*="text-emerald-300"],
    .slide-viewport [class*="text-emerald-400"] { color: #047857 !important; }

    .slide-viewport [class*="text-amber-200"],
    .slide-viewport [class*="text-amber-300"],
    .slide-viewport [class*="text-amber-400"],
    .slide-viewport .text-yellow-300 { color: #B45309 !important; }

    .slide-viewport [class*="text-rose-200"],
    .slide-viewport [class*="text-rose-300"],
    .slide-viewport [class*="text-rose-400"],
    .slide-viewport [class*="text-red-200"],
    .slide-viewport [class*="text-red-300"],
    .slide-viewport [class*="text-red-400"] { color: #BE123C !important; }

    .slide-viewport [class*="text-blue-300"],
    .slide-viewport [class*="text-blue-400"] { color: #1D4ED8 !important; }

    /* Card Backgrounds & Surfaces */
    .slide-viewport .bg-slate-800,
    .slide-viewport .bg-slate-800\/80,
    .slide-viewport .bg-slate-900,
    .slide-viewport .bg-slate-950,
    .slide-viewport .bg-slate-900\/60,
    .slide-viewport .bg-slate-900\/70,
    .slide-viewport .bg-slate-900\/80,
    .slide-viewport .bg-slate-900\/90,
    .slide-viewport .bg-slate-900\/95,
    .slide-viewport .bg-slate-950\/60,
    .slide-viewport .bg-slate-950\/70,
    .slide-viewport .bg-slate-950\/80,
    .slide-viewport .bg-slate-950\/85,
    .slide-viewport .bg-slate-950\/90 {
      background-color: #FFFFFF !important;
    }

    /* Clean Pill / Badge Chips */
    .slide-viewport span.bg-slate-800,
    .slide-viewport span[class*="bg-slate-800"] {
      background-color: #F1F5F9 !important;
      border: 1px solid #CBD5E1 !important;
      color: #334155 !important;
    }

    .slide-viewport .bg-dark-950,
    .slide-viewport .bg-dark-900,
    .slide-viewport .bg-dark-850 {
      background-color: #F8F9FA !important;
    }

    /* Soft Duotone & Semantic Tint Containers */
    .slide-viewport [class*="bg-sky-950"],
    .slide-viewport [class*="bg-cyan-950"],
    .slide-viewport [class*="bg-sky-500/"],
    .slide-viewport [class*="bg-cyan-500/"] {
      background-color: rgba(45, 155, 178, 0.08) !important;
    }

    .slide-viewport [class*="bg-indigo-950"],
    .slide-viewport [class*="bg-purple-950"],
    .slide-viewport [class*="bg-indigo-500/"],
    .slide-viewport [class*="bg-purple-500/"] {
      background-color: rgba(85, 69, 150, 0.08) !important;
    }

    .slide-viewport [class*="bg-emerald-950"],
    .slide-viewport [class*="bg-emerald-500/"] {
      background-color: rgba(5, 150, 105, 0.08) !important;
    }

    .slide-viewport [class*="bg-amber-950"],
    .slide-viewport [class*="bg-amber-500/"] {
      background-color: rgba(217, 119, 6, 0.08) !important;
    }

    .slide-viewport [class*="bg-rose-950"],
    .slide-viewport [class*="bg-rose-500/"],
    .slide-viewport [class*="bg-red-950"],
    .slide-viewport [class*="bg-red-500/"] {
      background-color: rgba(220, 38, 38, 0.08) !important;
    }

    .slide-viewport [class*="bg-blue-950"],
    .slide-viewport [class*="bg-blue-500/"] {
      background-color: rgba(29, 78, 216, 0.08) !important;
    }

    .slide-viewport [class*="border-rose-800"],
    .slide-viewport [class*="border-rose-900"],
    .slide-viewport [class*="border-red-800"],
    .slide-viewport [class*="border-red-900"] {
      border-color: rgba(220, 38, 38, 0.25) !important;
    }

    .slide-viewport [class*="border-amber-800"],
    .slide-viewport [class*="border-amber-900"] {
      border-color: rgba(217, 119, 6, 0.25) !important;
    }

    .slide-viewport [class*="border-emerald-800"],
    .slide-viewport [class*="border-emerald-900"] {
      border-color: rgba(5, 150, 105, 0.25) !important;
    }

    .slide-viewport [class*="border-blue-800"],
    .slide-viewport [class*="border-blue-900"] {
      border-color: rgba(29, 78, 216, 0.25) !important;
    }

    .slide-viewport [class*="divide-slate-800"],
    .slide-viewport [class*="divide-slate-700"] {
      border-color: #E2E8F0 !important;
    }

    /* Clean Editorial Borders */
    .slide-viewport .border-slate-800,
    .slide-viewport .border-slate-800\/60,
    .slide-viewport .border-slate-800\/80,
    .slide-viewport .border-slate-700,
    .slide-viewport .border-slate-700\/50,
    .slide-viewport .border-slate-700\/60 {
      border-color: #E2E8F0 !important;
    }

    .slide-viewport .border-sky-400\/20,
    .slide-viewport .border-sky-400\/30,
    .slide-viewport .border-sky-500\/30,
    .slide-viewport .border-sky-600\/50,
    .slide-viewport .border-sky-800,
    .slide-viewport .border-cyan-400\/20,
    .slide-viewport .border-cyan-400\/30,
    .slide-viewport .border-cyan-500\/30,
    .slide-viewport .border-cyan-600\/50,
    .slide-viewport .border-cyan-800\/40 {
      border-color: rgba(45, 155, 178, 0.35) !important;
    }

    .slide-viewport .border-indigo-400\/20,
    .slide-viewport .border-indigo-400\/30,
    .slide-viewport .border-indigo-500\/30,
    .slide-viewport .border-indigo-700\/50,
    .slide-viewport .border-purple-600\/50,
    .slide-viewport .border-purple-800 {
      border-color: rgba(85, 69, 150, 0.35) !important;
    }

    /* Code Tags & Snippets */
    .slide-viewport code {
      background-color: #F1F5F9 !important;
      color: #403375 !important;
      border: 1px solid #E2E8F0;
      border-radius: 0.25rem;
    }

    /* Key Takeaway bar */
    .slide-viewport .bg-cyan-950\/40,
    .slide-viewport .bg-indigo-950\/40 {
      background-color: rgba(45, 155, 178, 0.08) !important;
      border-color: rgba(45, 155, 178, 0.25) !important;
    }

    /* ==========================================================================
       ELIMINATE ALL HOVER & DARK-MODE EFFECTS
       Ensures elements inside slides never darken or revert to dark styles on hover
       ========================================================================== */
    #slidesWrapper tr:hover,
    #slidesWrapper [class*="hover:bg-"]:hover,
    #slidesWrapper [class*="hover:bg-slate"]:hover,
    #slidesWrapper [class*="hover:bg-dark"]:hover,
    #slidesWrapper [class*="hover:bg-indigo"]:hover,
    #slidesWrapper [class*="hover:bg-purple"]:hover {
      background-color: transparent !important;
    }

    #slidesWrapper [class*="hover:border-"]:hover {
      border-color: inherit !important;
    }
  </style>
</head>
<body>

  <!-- 16:9 Presentation Viewport -->
  <div class="slide-viewport relative flex flex-col justify-between" id="presentationContainer">

    <!-- Ambient Subtle Tints -->
    <div class="absolute -top-36 -right-36 w-96 h-96 bg-[#2D9BB2]/5 rounded-full blur-3xl pointer-events-none ambient-glow"></div>
    <div class="absolute -bottom-36 -left-36 w-96 h-96 bg-[#554596]/5 rounded-full blur-3xl pointer-events-none ambient-glow"></div>

    <!-- Global Header -->
    <header class="absolute top-0 left-0 right-0 h-14 px-10 flex items-center justify-between text-xs font-mono text-slate-500 z-20 border-b border-slate-200/80 bg-white/80 backdrop-blur-md">
      <div class="flex items-center gap-3">
        <span id="chapterBadge" class="px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-700 font-bold border border-slate-300 transition-all duration-200">INTRO · 오프닝</span>
        <span class="text-slate-300">|</span>
        <span class="text-slate-700 font-medium tracking-tight">말이 코드가 되는 시대 : 바이브 코딩(Vibe Coding)</span>
      </div>
      <div class="flex items-center gap-4">
        <button id="tocBtn" class="hover:text-[#2D9BB2] flex items-center gap-1.5 transition-colors px-2.5 py-1 rounded bg-slate-100 hover:bg-slate-200/80 border border-slate-200 text-slate-700 font-medium">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path></svg>
          <span>목차 [M]</span>
        </button>
        <button id="fullscreenBtn" class="hover:text-[#2D9BB2] flex items-center gap-1.5 transition-colors px-2.5 py-1 rounded bg-slate-100 hover:bg-slate-200/80 border border-slate-200 text-slate-700 font-medium">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1v4m0-4h-4m4 4l-5-5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
          <span>전체화면 [F]</span>
        </button>
        <span id="slideCounter" class="text-[#2D9BB2] font-bold font-mono">01 / {{TOTAL_SLIDES}}</span>
      </div>
    </header>

    <!-- Slides Wrapper (Injected from slides/ component files) -->
    <main class="relative w-full h-full pt-14 pb-12 flex-1 overflow-hidden" id="slidesWrapper">
{{SLIDES_CONTENT}}
    </main>

    <!-- Global Footer Controls -->
    <footer class="absolute bottom-0 left-0 right-0 h-12 px-8 flex items-center justify-between text-xs text-slate-500 z-20 border-t border-slate-200/80 bg-white/85 backdrop-blur-sm">
      <div class="flex items-center gap-2">
        <span class="text-[11px] text-slate-400 font-mono">단축키: ← 이전 | → / Space 다음 | F 전체화면 | M 목차</span>
      </div>

      <!-- Navigation buttons -->
      <div class="flex items-center gap-3">
        <button id="prevBtn" class="px-3 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors flex items-center gap-1 border border-slate-300 font-medium">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
          <span>이전</span>
        </button>
        <button id="nextBtn" class="px-4 py-1 rounded bg-[#2D9BB2] hover:bg-[#258296] text-white font-semibold transition-colors flex items-center gap-1 shadow-sm">
          <span>다음</span>
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </button>
      </div>

      <!-- Progress bar -->
      <div class="w-32 bg-slate-200 h-1.5 rounded-full overflow-hidden border border-slate-300/50">
        <div id="progressBar" class="bg-gradient-to-r from-[#2D9BB2] to-[#554596] h-full w-0 transition-all duration-300"></div>
      </div>
    </footer>

    <!-- Table of Contents Modal -->
    <div id="tocModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
      <div class="bento-tile max-w-3xl w-full p-6 max-h-[85vh] flex flex-col border border-slate-300 bg-[#F8F9FA] shadow-2xl">
        <div class="flex items-center justify-between pb-3 border-b border-slate-200 mb-4">
          <div class="flex items-center gap-3">
            <h3 class="text-lg font-bold text-[#1A1A1A] flex items-center gap-2">
              <span class="text-[#2D9BB2] font-mono">📑</span> 전체 목차 (Curriculum Index)
            </h3>
            <span class="text-xs text-slate-500 font-mono">총 {{TOTAL_SLIDES}}개 슬라이드</span>
          </div>
          <div class="flex items-center gap-3">
            <button id="toggleAllTocBtn" class="text-xs px-2.5 py-1 rounded bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 flex items-center gap-1.5 transition-colors font-medium">
              <svg id="toggleAllIcon" class="w-3.5 h-3.5 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
              <span id="toggleAllText">모두 접기</span>
            </button>
            <button id="closeTocBtn" class="text-slate-400 hover:text-slate-700 p-1">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
          </div>
        </div>
        <div id="tocList" class="overflow-y-auto space-y-3 pr-2 flex-1 text-sm">
          <!-- Dynamically populated with Depth 1 (Chapters) & Depth 2 (Slides) -->
        </div>
      </div>
    </div>

  </div>

  <script>
    const slides = document.querySelectorAll('.slide');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const slideCounter = document.getElementById('slideCounter');
    const progressBar = document.getElementById('progressBar');
    const tocBtn = document.getElementById('tocBtn');
    const tocModal = document.getElementById('tocModal');
    const closeTocBtn = document.getElementById('closeTocBtn');
    const tocList = document.getElementById('tocList');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const chapterBadge = document.getElementById('chapterBadge');
    const toggleAllTocBtn = document.getElementById('toggleAllTocBtn');
    const toggleAllIcon = document.getElementById('toggleAllIcon');
    const toggleAllText = document.getElementById('toggleAllText');

    let currentSlide = 0;
    const totalSlides = slides.length;

    function updateSlide(index) {
      if (index < 0) index = 0;
      if (index >= totalSlides) index = totalSlides - 1;

      slides.forEach((slide, idx) => {
        slide.classList.remove('active');
        if (idx === index) {
          slide.classList.add('active');
        }
      });

      currentSlide = index;

      const currentSlideEl = slides[currentSlide];
      if (currentSlideEl && chapterBadge) {
        const badgeText = currentSlideEl.getAttribute('data-chapter-badge') || 'VIBE CODING';
        const badgeColor = currentSlideEl.getAttribute('data-chapter-color') || 'bg-[#2D9BB2]/10 text-[#1B7385] border-[#2D9BB2]/30';
        chapterBadge.textContent = badgeText;
        chapterBadge.className = `px-2.5 py-0.5 rounded-full font-bold border transition-all duration-200 ${badgeColor}`;
      }

      const currentStr = String(currentSlide + 1).padStart(2, '0');
      const totalStr = String(totalSlides).padStart(2, '0');
      slideCounter.textContent = `${currentStr} / ${totalStr}`;

      const progress = ((currentSlide + 1) / totalSlides) * 100;
      progressBar.style.width = `${progress}%`;

      prevBtn.disabled = currentSlide === 0;
      prevBtn.style.opacity = currentSlide === 0 ? '0.4' : '1';
      nextBtn.disabled = currentSlide === totalSlides - 1;
      nextBtn.style.opacity = currentSlide === totalSlides - 1 ? '0.4' : '1';

      // Update active highlight in TOC if rendered
      document.querySelectorAll('.toc-slide-item').forEach((item) => {
        const itemIdx = parseInt(item.getAttribute('data-slide-index'), 10);
        if (itemIdx === currentSlide) {
          item.classList.add('bg-[#2D9BB2]/10', 'text-[#1B7385]', 'border-[#2D9BB2]/40', 'font-semibold');
          item.classList.remove('text-slate-700', 'border-transparent');
        } else {
          item.classList.remove('bg-[#2D9BB2]/10', 'text-[#1B7385]', 'border-[#2D9BB2]/40', 'font-semibold');
          item.classList.add('text-slate-700', 'border-transparent');
        }
      });
    }

    function prevSlide() { if (currentSlide > 0) updateSlide(currentSlide - 1); }
    function nextSlide() { if (currentSlide < totalSlides - 1) updateSlide(currentSlide + 1); }

    window.addEventListener('keydown', (e) => {
      if (!tocModal.classList.contains('hidden')) {
        if (e.key === 'Escape' || e.key === 'm' || e.key === 'M') toggleToc(false);
        return;
      }

      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') nextSlide();
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
      else if (e.key === 'Home') updateSlide(0);
      else if (e.key === 'End') updateSlide(totalSlides - 1);
      else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
      else if (e.key === 'm' || e.key === 'M') toggleToc(true);
    });

    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }
    fullscreenBtn.addEventListener('click', toggleFullscreen);

    // Build 2-Depth Table of Contents (Depth 1: Chapters, Depth 2: Slides)
    const chapters = [];
    let currentChapterGroup = null;

    slides.forEach((slide, idx) => {
      const chapterId = slide.getAttribute('data-chapter-id') || 'misc';
      const chapterBadge = slide.getAttribute('data-chapter-badge') || 'CHAPTER';
      const chapterTitle = slide.getAttribute('data-chapter-title') || chapterBadge;
      const chapterColor = slide.getAttribute('data-chapter-color') || 'bg-[#2D9BB2]/10 text-[#1B7385] border-[#2D9BB2]/30';
      const chapterAccent = slide.getAttribute('data-chapter-accent') || 'text-[#2D9BB2]';
      const slideTitle = slide.getAttribute('data-title') || `Slide ${idx + 1}`;

      if (!currentChapterGroup || currentChapterGroup.id !== chapterId) {
        currentChapterGroup = {
          id: chapterId,
          badge: chapterBadge,
          title: chapterTitle,
          color: chapterColor,
          accent: chapterAccent,
          slides: []
        };
        chapters.push(currentChapterGroup);
      }

      currentChapterGroup.slides.push({
        index: idx,
        title: slideTitle,
      });
    });

    let allExpanded = true;
    const chapterBodies = [];
    const chevronIcons = [];

    chapters.forEach((ch) => {
      const chapterCard = document.createElement('div');
      chapterCard.className = 'bento-tile p-3 bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm transition-all';

      // Depth 1 Header
      const header = document.createElement('div');
      header.className = 'flex items-center justify-between cursor-pointer select-none p-1.5 rounded-lg hover:bg-slate-50 transition-colors';

      const firstSlideNum = String(ch.slides[0].index + 1).padStart(2, '0');
      const lastSlideNum = String(ch.slides[ch.slides.length - 1].index + 1).padStart(2, '0');
      const rangeStr = ch.slides.length > 1 ? `#${firstSlideNum} ~ #${lastSlideNum}` : `#${firstSlideNum}`;

      header.innerHTML = `
        <div class="flex items-center gap-2.5">
          <svg class="w-4 h-4 text-slate-400 transition-transform duration-200 transform rotate-0 chevron-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
          <span class="px-2 py-0.5 rounded text-[11px] font-bold font-mono border ${ch.color}">${ch.badge}</span>
          <span class="font-bold text-[#1A1A1A] text-sm tracking-tight">${ch.title}</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-xs font-mono text-slate-600 bg-slate-100 px-2 py-0.5 rounded border border-slate-200">${ch.slides.length} slides</span>
          <span class="text-[11px] font-mono text-slate-400">${rangeStr}</span>
        </div>
      `;

      // Depth 2 Slides List (Default: Expanded)
      const body = document.createElement('div');
      body.className = 'chapter-body mt-2.5 pt-2 border-t border-slate-200/80 space-y-1 pl-4';

      const chevron = header.querySelector('.chevron-icon');
      chapterBodies.push(body);
      chevronIcons.push(chevron);

      // Toggle expand/collapse on header click
      header.addEventListener('click', () => {
        const isHidden = body.classList.contains('hidden');
        if (isHidden) {
          body.classList.remove('hidden');
          chevron.classList.remove('-rotate-90');
          chevron.classList.add('rotate-0');
        } else {
          body.classList.add('hidden');
          chevron.classList.remove('rotate-0');
          chevron.classList.add('-rotate-90');
        }
      });

      ch.slides.forEach((s) => {
        const item = document.createElement('div');
        item.className = 'toc-slide-item px-3 py-1.5 rounded-lg hover:bg-slate-100 cursor-pointer flex items-center justify-between text-slate-700 transition-colors border border-transparent hover:border-slate-300';
        item.setAttribute('data-slide-index', s.index);
        item.innerHTML = `
          <span class="flex items-center gap-2.5 truncate">
            <span class="font-mono text-xs ${ch.accent} font-bold">${String(s.index + 1).padStart(2, '0')}</span>
            <span class="text-xs truncate text-slate-800">${s.title}</span>
          </span>
          <span class="text-[10px] text-slate-400 font-mono ml-2 shrink-0">#${s.index + 1}</span>
        `;
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          updateSlide(s.index);
          toggleToc(false);
        });
        body.appendChild(item);
      });

      chapterCard.appendChild(header);
      chapterCard.appendChild(body);
      tocList.appendChild(chapterCard);
    });

    // Toggle All Expand / Collapse
    if (toggleAllTocBtn) {
      toggleAllTocBtn.addEventListener('click', () => {
        allExpanded = !allExpanded;
        chapterBodies.forEach(b => {
          if (allExpanded) {
            b.classList.remove('hidden');
          } else {
            b.classList.add('hidden');
          }
        });
        chevronIcons.forEach(icon => {
          if (allExpanded) {
            icon.classList.remove('-rotate-90');
            icon.classList.add('rotate-0');
          } else {
            icon.classList.remove('rotate-0');
            icon.classList.add('-rotate-90');
          }
        });
        toggleAllText.textContent = allExpanded ? '모두 접기' : '모두 펼치기';
        if (toggleAllIcon) {
          toggleAllIcon.classList.toggle('rotate-180', !allExpanded);
        }
      });
    }

    function toggleToc(show) {
      if (show) {
        tocModal.classList.remove('hidden');
        setTimeout(() => {
          tocModal.classList.remove('opacity-0');
          const activeItem = tocList.querySelector(`.toc-slide-item[data-slide-index="${currentSlide}"]`);
          if (activeItem) {
            const parentBody = activeItem.closest('.chapter-body');
            if (parentBody && parentBody.classList.contains('hidden')) {
              parentBody.classList.remove('hidden');
              const header = parentBody.previousElementSibling;
              const chevron = header ? header.querySelector('.chevron-icon') : null;
              if (chevron) {
                chevron.classList.remove('-rotate-90');
                chevron.classList.add('rotate-0');
              }
            }
            activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          }
        }, 10);
      } else {
        tocModal.classList.add('opacity-0');
        setTimeout(() => tocModal.classList.add('hidden'), 200);
      }
    }

    tocBtn.addEventListener('click', () => toggleToc(true));
    closeTocBtn.addEventListener('click', () => toggleToc(false));
    tocModal.addEventListener('click', (e) => {
      if (e.target === tocModal) toggleToc(false);
    });

    window.updateSlide = updateSlide;
    updateSlide(0);
  </script>
</body>
</html>
